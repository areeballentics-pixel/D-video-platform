services:
  postgres:
    image: postgres:16-alpine
    container_name: svp-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: svp
      POSTGRES_PASSWORD: svp_dev_password
      POSTGRES_DB: secure_video_platform
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U svp"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: svp-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
  redis-data:

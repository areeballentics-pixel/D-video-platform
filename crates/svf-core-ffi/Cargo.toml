[package]
name = "svf-core-ffi"
version = "0.1.0"
edition = "2021"
description = "Plain C ABI bridge from svf-core to iOS Swift (AVPlayer resource loader)"

[lib]
name = "svf_core_ffi"
crate-type = ["staticlib", "cdylib"]

[dependencies]
svf-core = { path = "../svf-core" }
log = "0.4"
once_cell = "1"

# iOS-specific logging via os_log
[target.'cfg(target_os = "ios")'.dependencies]
oslog = { version = "0.2", default-features = false }

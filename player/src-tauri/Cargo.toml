[package]
name = "secure-video-player"
version = "0.2.6"
edition = "2021"
description = "Secure encrypted video player for EdTech"

[lib]
name = "secure_video_player_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# ─── Shared SVF format + crypto + device fingerprint ───
svf-core = { path = "../../crates/svf-core" }

# ─── Tauri core ───
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# ─── Async runtime ───
tokio = { version = "1", features = ["full"] }

# ─── Cryptography ───
aes = "0.8"
ctr = "0.9"
cipher = "0.4"
sha2 = "0.10"
hkdf = "0.12"
hmac = "0.12"
rand = "0.8"
hex = "0.4"
base64 = "0.22"
zeroize = { version = "1", features = ["derive"] }
aes-gcm = "0.10"

# ─── JWT & Auth ───
jsonwebtoken = "9"

# ─── Utilities ───
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
byteorder = "1"
hostname = "0.4"
thiserror = "2"
log = "0.4"
env_logger = "0.11"
directories = "6"

# ─── HTTP (client for license server, server for local playback) ───
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
warp = "0.3"

# ─── Windows-specific APIs (screen capture, WMI, debugger detection) ───
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_Threading",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Memory",
  "Win32_Security",
  "Win32_Security_Cryptography",
  "Win32_System_RemoteDesktop",
  "Win32_Foundation",
] }
wmi = "0.18"


# Release profile is defined at the workspace root (../../Cargo.toml).

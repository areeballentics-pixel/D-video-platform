# Production deployment — coexists with an existing Traefik reverse proxy.
#
# This compose expects Traefik to already be running on the host (e.g. as
# part of an n8n or other stack) and to be attached to an external Docker
# network named `n8n_default` (the default when n8n is deployed via compose
# in a directory called `n8n`).
#
# Traefik config assumed (matches n8n-traefik-1 by default):
#   - entrypoint "websecure" on :443 with HTTPS
#   - entrypoint "web" on :80 redirecting to websecure
#   - cert resolver named "mytlschallenge" using ACME TLS-ALPN-01
#   - --providers.docker.exposedbydefault=false (opt-in via traefik.enable)
#
# If your Traefik uses different entrypoint/resolver names, edit the
# `traefik.*` labels on the `server` service below.
#
# Runs:
#   - Postgres 16   (internal only, no host port exposed)
#   - Redis 7       (internal only, no host port exposed)
#   - FastAPI       (reachable to Traefik via n8n_default; talks to postgres
#                    + redis via internal net). No background worker — v1.5
#                    institutes encrypt locally on the desktop.
#
# Master dashboard goes to Vercel. The encryptor + player are Tauri desktop
# apps shipped to institutes/students directly.
#
# Usage on the VPS:
#   cp .env.prod.example .env    # or create .env manually with secrets
#   docker compose -f docker-compose.prod.yml up -d --build
#
# First-time master-admin bootstrap:
#   docker compose -f docker-compose.prod.yml exec server \
#     python scripts/bootstrap_platform_admin.py \
#       --email you@yourplatform.com --password 'StrongPass!'
#
# Subsequent updates (after a `git pull`):
#   docker compose -f docker-compose.prod.yml up -d --build server
# Alembic migrations run automatically on container start (see Dockerfile CMD).

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Intentionally no `ports:` — Postgres only reachable via internal net.
    networks:
      - internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - internal

  server:
    build: ./server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
      REDIS_URL: "redis://redis:6379/0"
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 120
      REFRESH_TOKEN_EXPIRE_DAYS: 7
      SERVER_ENCRYPTION_KEY: ${SERVER_ENCRYPTION_KEY}
      ADMIN_API_KEY: ${ADMIN_API_KEY}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      DEFAULT_MAX_DEVICES: ${DEFAULT_MAX_DEVICES:-2}
      DEFAULT_MAX_DEVICE_CHANGES_PER_30D: ${DEFAULT_MAX_DEVICE_CHANGES_PER_30D:-2}
      DEFAULT_OFFLINE_GRACE_DAYS: ${DEFAULT_OFFLINE_GRACE_DAYS:-20}
      PORT: "8000"
      # Make /app importable for alembic (the Dockerfile pip-installs
      # dependencies before the source is copied, so the `app` package
      # isn't registered in site-packages; explicitly add to PYTHONPATH).
      PYTHONPATH: /app
    # No bind-mounted video volumes in v1 — institutes host their own .svf
    # files (Google Drive etc.) and the server stores only metadata. The
    # legacy `video_data` and `upload_data` volumes have been removed.
    networks:
      - internal        # talks to postgres + redis
      - traefik_public  # reachable by the external Traefik
    labels:
      # Opt in to Traefik routing (since Traefik is configured with
      # --providers.docker.exposedbydefault=false)
      - "traefik.enable=true"
      # When a container has multiple networks, tell Traefik which one
      # to use when connecting to the backend.
      - "traefik.docker.network=n8n_default"
      # Router: match Host(api.allentics.com) on the HTTPS entrypoint,
      # with TLS terminated by the ACME resolver.
      - "traefik.http.routers.svp-api.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.svp-api.entrypoints=websecure"
      - "traefik.http.routers.svp-api.tls=true"
      - "traefik.http.routers.svp-api.tls.certresolver=mytlschallenge"
      # Service: forward to the container's internal port 8000.
      - "traefik.http.services.svp-api.loadbalancer.server.port=8000"

volumes:
  postgres_data:
  redis_data:

networks:
  # Private network for postgres/redis/server chat — no external access.
  internal:
  # External Traefik network (already created by the n8n stack).
  # The literal name `n8n_default` matches what docker compose assigns
  # when run from /docker/n8n (project name = "n8n").
  traefik_public:
    external: true
    name: n8n_default
